<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Details | Style Story</title>
<style>
:root{--ink:#342725;--muted:#7d706b;--line:#eaded8;--cream:#fbf7f3;--gold:#b18a61;--rose:#a65f63}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Arial,sans-serif}header{padding:18px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px}a{color:inherit}.brand{font:26px Georgia,serif;letter-spacing:1px;text-decoration:none}.nav{display:flex;gap:16px;align-items:center;text-decoration:none}.wrap{max-width:1120px;margin:30px auto;padding:0 18px}.crumb{color:var(--muted);font-size:13px;margin-bottom:22px}.product{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:clamp(24px,5vw,64px);align-items:start}.photo{background:var(--cream);border-radius:18px;overflow:hidden;min-height:350px;display:grid;place-items:center}.photo img{width:100%;max-height:680px;object-fit:contain;display:block}.details{padding:10px 0}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--gold)}h1{font:clamp(30px,4vw,44px) Georgia,serif;line-height:1.12;margin:12px 0}.price{font-size:25px;font-weight:700;margin:16px 0}.desc{color:var(--muted);line-height:1.7;white-space:pre-line}.stock{font-size:13px;color:#557653}.field{margin:20px 0}.field label{display:block;font-size:13px;margin-bottom:8px}.field select,.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:white;font:inherit}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.btn{border-radius:999px;padding:15px 12px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:white;color:var(--ink)}.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:18px}.err{padding:40px 0;text-align:center}.return-policy{margin-top:22px;padding:18px;border:1px solid #ead8ce;border-radius:14px;background:#fbf4ef}.return-policy h2{font:22px Georgia,serif;margin:0 0 10px}.return-policy p{font-size:13px;line-height:1.7;color:var(--muted);margin:8px 0}.return-policy strong{color:var(--ink)}.return-policy .policy-title{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);margin-bottom:6px}.return-policy .policy-title span{font-size:18px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 18px;border-radius:999px;display:none;max-width:90%}@media(max-width:720px){.product{grid-template-columns:1fr;gap:20px}.photo{min-height:260px}.photo img{max-height:480px}.wrap{margin:20px auto}.actions{grid-template-columns:1fr}.brand{font-size:22px}}
</style></head><body><header><a class="brand" href="/">STYLE STORY</a><nav class="nav"><a href="/track.html">Track Order</a><a href="/">← Shop</a></nav></header>
<main class="wrap"><div class="crumb"><a href="/">Home</a> / Product details</div><div id="content"><p>Loading product…</p></div></main><div class="toast" id="toast"></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const id=new URLSearchParams(location.search).get("id");let product;
function toast(t){const el=document.querySelector("#toast");el.textContent=t;el.style.display="block";setTimeout(()=>el.style.display="none",2500)}
async function init(){try{const r=await fetch("/api/products");const products=await r.json();product=products.find(p=>String(p.id)===String(id)&&p.active!==false);if(!product)throw Error("This product could not be found.");document.title=product.name+" | Style Story";document.querySelector("#content").innerHTML=`<section class="product"><div class="photo"><img src="${esc(product.imageUrl)}" alt="${esc(product.name)}" onerror="this.style.display='none'"></div><div class="details"><div class="eyebrow">${esc(product.category||"Style Story collection")}</div><h1>${esc(product.name)}</h1><div class="price">${money(product.price)}</div><p class="stock">${Number(product.stock)>0?`${product.stock} in stock`:"Currently out of stock"}</p><p class="desc">${esc(product.description||"A carefully selected piece from Style Story.")}</p>${product.sizes?.length?`<div class="field"><label for="size">Select size</label><select id="size">${product.sizes.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("")}</select></div>`:""}<div class="field"><label for="qty">Quantity</label><input id="qty" type="number" min="1" max="${Math.max(1,Math.min(10,Number(product.stock)||1))}" value="1"></div><div class="actions"><button class="btn" id="buy" ${product.stock<1?"disabled":""}>BUY NOW</button><button class="btn secondary" id="add" ${product.stock<1?"disabled":""}>ADD TO BAG</button></div><section class="return-policy" aria-labelledby="return-policy-title"><h2 id="return-policy-title">Return Policy</h2><div class="policy-title"><span aria-hidden="true">🎥</span> Unboxing Video Is Important</div><p>If your item arrives <strong>damaged or incorrect</strong>, please keep a clear, continuous unboxing video from the moment the sealed parcel is opened. This helps us verify the issue.</p><p><strong>Video proof is required</strong> for damaged or incorrect-item return/refund requests. Requests without the required video may not be accepted, subject to applicable consumer-protection laws.</p><p>Please contact Style Story with your order details and video as soon as possible after delivery.</p></section><p class="note">Secure your order through our checkout. UPI payments remain pending until the store verifies payment. For order updates, use the Track Order page.</p></div></section>`;document.querySelector("#add").onclick=()=>{add(false)};document.querySelector("#buy").onclick=()=>{add(true)}}catch(e){document.querySelector("#content").innerHTML=`<div class="err"><h1>Product unavailable</h1><p>${esc(e.message)}</p><a href="/">Back to shop</a></div>`}}
function add(buy){const qty=Math.max(1,Math.min(Number(document.querySelector("#qty").value)||1,Number(product.stock)||1,10));const size=document.querySelector("#size")?.value||"";let cart=JSON.parse(localStorage.getItem("styleStoryCart")||"[]");const found=cart.find(x=>String(x.id)===String(product.id)&&x.size===size);if(found)found.quantity=Math.min(Number(product.stock)||1,found.quantity+qty);else cart.push({id:product.id,quantity:qty,size});localStorage.setItem("styleStoryCart",JSON.stringify(cart));if(buy)location.href="/?checkout=1";else toast("Added to your bag.")}
init();
</script></body></html>
