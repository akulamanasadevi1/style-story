name: Style Story checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/razorpay-test-integration]

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check server JavaScript syntax
        run: npm run check
      - name: Check storefront inline JavaScript syntax
        run: node scripts/check-inline-js.js
