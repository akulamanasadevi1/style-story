<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Your Order | Style Story</title>
<style>
:root{--ink:#342725;--muted:#7d706b;--line:#eaded8;--cream:#fbf7f3;--gold:#b18a61;--rose:#a65f63}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}header{padding:20px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;background:#fff}header a{color:var(--ink);text-decoration:none}.brand{font:26px Georgia,serif;letter-spacing:1px}.wrap{max-width:760px;margin:38px auto;padding:0 16px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,5vw,36px);box-shadow:0 12px 35px #4b2c1710}h1{font:32px Georgia,serif;margin:0 0 10px}p{line-height:1.55}.muted{color:var(--muted)}label{display:block;font-size:13px;margin:16px 0 7px}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;font:inherit}button,.btn{border:0;border-radius:999px;background:var(--ink);color:#fff;padding:13px 20px;cursor:pointer;text-decoration:none;display:inline-block;font:inherit}.full{width:100%;margin-top:18px}.error{color:#a52828;margin-top:14px}.result{display:none;margin-top:24px;border-top:1px solid var(--line);padding-top:22px}.status{display:inline-block;padding:7px 12px;border-radius:999px;background:#f7ead7;color:#825820;font-size:13px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0}.step{padding:12px 5px;text-align:center;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}.step .dot{width:26px;height:26px;border-radius:50%;background:#f1e6df;display:grid;place-items:center;margin:0 auto 8px;font-weight:bold}.step.active{border-color:#9cba9e;background:#f4faf4;color:#315f39}.step.active .dot{background:#d8ead9;color:#315f39}.items{padding-left:20px}.small{font-size:12px;color:var(--muted)}@media(max-width:520px){.steps{grid-template-columns:repeat(2,1fr)}header{padding:16px}.brand{font-size:22px}}

/* STYLE STORY — order tracking theme */
:root{--ink:#35263a!important;--muted:#796b80!important;--line:#eadced!important;--cream:#fff8f5!important;--gold:#a77bb7!important;--rose:#b64f83!important}
body{background:radial-gradient(ellipse at 8% 4%,#fbe2ef 0,transparent 30%),radial-gradient(ellipse at 95% 12%,#eee5ff 0,transparent 34%),linear-gradient(180deg,#fffaf7,#fff7fb)!important;color:#35263a!important}
header{background:#fffaf7ed!important;border-color:#eadced!important;box-shadow:0 8px 28px #61395b0b!important}
header a{color:#49324f!important}.brand{color:#49324f!important}
.wrap{max-width:820px!important}
.card{background:linear-gradient(135deg,#fffdfb,#fff5fa 65%,#f8f2ff)!important;border:1px solid #eadced!important;border-radius:22px!important;box-shadow:0 18px 50px #734a7415!important}
h1{color:#39243e!important}
p{color:#6f5c76}
.muted,.small{color:#85738a!important}
label{color:#725a78!important}
input{border-color:#e6d6e9!important;border-radius:11px!important;background:#fff!important}
input:focus{outline:2px solid #d6a3d6!important;border-color:#b86ca8!important}
button,.btn{background:linear-gradient(120deg,#b64f83,#8e4a9e)!important;color:#fff!important;border:1px solid #b25d9e!important;border-radius:10px!important;box-shadow:0 6px 16px #a14a8526!important;font-weight:750!important}
button:hover,.btn:hover{background:linear-gradient(120deg,#ca6094,#a45bb3)!important;transform:translateY(-1px)}
.status{background:#f7e4f1!important;color:#8e3673!important;border:1px solid #eccbe4!important}
.steps{gap:10px!important}
.step{background:#fff9fd!important;border-color:#eadced!important;border-radius:13px!important;color:#796b80!important}
.step .dot{background:#f2e7ff!important;color:#80508f!important}
.step.active{border-color:#c99bd0!important;background:#fbf2ff!important;color:#70427c!important}
.step.active .dot{background:#e8d5f4!important;color:#70427c!important}
.result{border-color:#eadced!important}
.error{color:#a12655!important;background:#fff0f5!important;border-radius:9px!important;padding:10px!important}
@media(max-width:520px){.card{border-radius:17px!important;padding:20px!important}}

</style></head><body>
<header><a class="brand" href="/">STYLE STORY</a><a href="/">← Continue shopping</a></header>
<main class="wrap"><section class="card"><h1>Track your orders</h1><p class="muted">Enter the mobile number used at checkout to see all orders linked to that number.</p>
<form id="trackForm"><label for="phone">Registered mobile number</label><input id="phone" required inputmode="tel" autocomplete="tel" pattern="[6-9][0-9]{9}" minlength="10" maxlength="10" placeholder="10-digit mobile number"><button class="full" type="submit" id="submitBtn">Find my orders</button></form><p id="error" class="error" role="alert"></p>
<section class="result" id="result"><h2 style="font:25px Georgia,serif;margin:0 0 12px">Your orders</h2><div id="orderResults"></div><p class="small">Statuses depend on the store updating each order. This page does not show live courier GPS location.</p></section>
</section></main>
<script>
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const statusLabel=s=>({"PENDING_PAYMENT":"Payment pending","PAID":"Payment confirmed","PROCESSING":"Processing","SHIPPED":"Shipped","DELIVERED":"Delivered","CANCELLED":"Cancelled"})[s]||s||"Status unavailable";
const labels=[["PENDING_PAYMENT","Order placed"],["PAID","Payment confirmed"],["PROCESSING","Processing"],["SHIPPED","Shipped"],["DELIVERED","Delivered"]];
document.querySelector("#phone").addEventListener("input",e=>{e.target.value=e.target.value.replace(/\\D/g,"").slice(0,10)});
document.querySelector("#trackForm").onsubmit=async e=>{
 e.preventDefault();const btn=document.querySelector("#submitBtn"),err=document.querySelector("#error"),res=document.querySelector("#result");
 btn.disabled=true;btn.textContent="Checking…";err.textContent="";res.style.display="none";
 try{
  const phone=document.querySelector("#phone").value.trim();
  const r=await fetch("/api/track-order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone})});
  const d=await r.json();if(!r.ok)throw Error(d.error||"Could not find your orders.");
  document.querySelector("#orderResults").innerHTML=(d.orders||[]).map(order=>{
   const idx=labels.findIndex(x=>x[0]===order.status);
   const items=(order.items||[]).map(item=>`<li>${esc(item.name)} × ${Number(item.quantity)||1}${item.size?" · Size "+esc(item.size):""}</li>`).join("");
   const date=order.createdAt?new Date(order.createdAt).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"";
   const steps=order.status==="CANCELLED"?"<p class='small'>This order was cancelled.</p>":`<div class="steps">${labels.map((x,i)=>`<div class="step ${idx>=0&&i<=idx?"active":""}"><div class="dot">${idx>=0&&i<=idx?"✓":i+1}</div>${x[1]}</div>`).join("")}</div>`;
   const payment=order.paymentStatus==="PAID"?"Paid":"Payment pending";
   return `<article style="border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><strong>Order ${esc(order.id)}</strong><span class="status">${esc(statusLabel(order.status))}</span></div><p class="small">${esc(date)} · Payment: ${esc(payment)}</p>${steps}<h3>Items</h3><ul class="items">${items||"<li>Order items</li>"}</ul><div style="border-top:1px solid var(--line);padding-top:12px"><p style="display:flex;justify-content:space-between;margin:6px 0"><span>Product subtotal</span><strong>${money(order.subtotal)}</strong></p><p style="display:flex;justify-content:space-between;margin:6px 0"><span>Shipping</span><strong>${money(order.shipping)}</strong></p><p style="display:flex;justify-content:space-between;margin:8px 0;font-size:17px"><span>Total</span><strong>${money(order.total)}</strong></p></div></article>`;
  }).join("");
  res.style.display="block";
 }catch(err2){err.textContent=err2.message}finally{btn.disabled=false;btn.textContent="Find my orders"}
};
</script></body></html>
